; Classic ESP32 only. ESP32-S3 has no Bluetooth Classic.
; HFP HF + BLE + RFCOMM does not fit the default 1.25 MB app partition.
[env:esp32dev]
platform = espressif32@53.3.12
board = esp32dev
framework = arduino
monitor_port = COM19
monitor_speed = 115200
upload_port = COM19
board_build.mcu = esp32
board_build.partitions = huge_app_32mbit.csv
